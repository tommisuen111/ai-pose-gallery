<script type="module">
import {FilesetResolver,PoseLandmarker} from '/mp/vision_bundle.mjs'
const fs=await FilesetResolver.forVisionTasks('/mp/wasm')
async function load(u){const im=new Image();im.src=u;await im.decode();return im}
function px(im,w,h){const c=new OffscreenCanvas(w,h);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);return x.getImageData(0,0,w,h)}
function blur(a,w,h,r){const o=new Float32Array(a.length),t=new Float32Array(a.length);for(let y=0;y<h;y++){let s=0;for(let x=-r;x<=r;x++)s+=a[y*w+Math.min(w-1,Math.max(0,x))];for(let x=0;x<w;x++){t[y*w+x]=s/(2*r+1);s+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)]}}
 for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Math.min(h-1,Math.max(0,y))*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/(2*r+1);s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]}}return o}
function make(dI,wI,variant){
  const W=600,H=800;const d=new Float32Array(W*H);for(let i=0;i<W*H;i++)d[i]=dI.data[i*4]/255
  const c=new OffscreenCanvas(W,H);const x=c.getContext('2d');const o=x.createImageData(W,H)
  const ds=blur(d,W,H,2),bg=blur(d,W,H,40),skin=[224,172,140],bgc=[70,90,120]
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=y*W+xx
    const gx=(ds[y*W+Math.min(W-1,xx+1)]-ds[y*W+Math.max(0,xx-1)])*W/6,gy=(ds[Math.min(H-1,y+1)*W+xx]-ds[Math.max(0,y-1)*W+xx])*W/6
    const nl=1/Math.hypot(gx,gy,1);const sh=Math.max(0,(gx*0.4+gy*0.5+0.75)*nl)
    const m=Math.min(1,Math.max(0,(d[i]-Math.min(0.55,bg[i]*0.9+0.08))*12));const v=0.35+0.65*sh
    let r=skin[0]*v*m+bgc[0]*(1-m),g=skin[1]*v*m+bgc[1]*(1-m),b=skin[2]*v*m+bgc[2]*(1-m)
    if(variant==='shadeline'){const k=0.5+0.5*wI.data[i*4]/255;r*=k;g*=k;b*=k}
    o.data[i*4]=r;o.data[i*4+1]=g;o.data[i*4+2]=b;o.data[i*4+3]=255}
  x.putImageData(o,0,0);return c}
const pls={}
async function pl(n){return pls[n]??=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:`/model/pose_landmarker_heavy.task`,delegate:'CPU'},runningMode:'IMAGE',numPoses:n,minPoseDetectionConfidence:0.1,minPosePresenceConfidence:0.1})}
const r3=n=>Math.round(n*1000)/1000
window.run=async(white,depth,n)=>{
  const dImg=await load(depth),wImg=await load(white);const dI=px(dImg,600,800),wI=px(wImg,600,800);const p=await pl(n);const out={}
  for(const v of ['shade','shadeline','depth']){const src=v==='depth'?dImg:make(dI,wI,v);const r=p.detect(src)
    out[v]=r.worldLandmarks.map((w,k)=>({w:w.flatMap(q=>[r3(q.x),r3(-q.y),r3(-q.z),r3(q.visibility)]),l:r.landmarks[k].flatMap(q=>[r3(q.x),r3(q.y)])}))}
  return out}
window.ready=true
</script>
